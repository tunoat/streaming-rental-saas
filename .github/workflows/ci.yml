name: Phase 1 checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_migration_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://stream_app:local_runtime_only@127.0.0.1:5432/postgres
      MIGRATION_DATABASE_URL: postgres://postgres:local_migration_only@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:local_migration_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: git diff --exit-code -- packages/shared/bot-contract.d.ts
      - run: npm run build
      - run: npm run contract:lint
      - run: npm audit --audit-level=high
      - run: npm run migrate
      - run: npm run migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/

