<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการร้านสตรีมมิง</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <strong id="user-level">บัญชีผู้ใช้</strong><span>ข้อมูลจำลอง / โหมดทดสอบ</span>
    <button id="owner-settings" type="button" aria-label="ตั้งค่า Owner" title="ตั้งค่า Owner" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle><path d="M4 22v-2a8 8 0 0 1 16 0v2"></path>
      </svg>
    </button>
  </header>
  <main>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="login" aria-labelledby="login-title">
      <h1 id="login-title">เข้าสู่ระบบ</h1>
      <form id="credentials">
        <label>ชื่อผู้ใช้ <input name="username" autocomplete="username" required></label>
        <label>รหัสผ่าน <input name="password" type="password" autocomplete="current-password" required></label>
        <button>เข้าสู่ระบบ</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <div class="toolbar">
        <label id="store-control">ร้าน <select id="store"></select></label>
        <button id="logout" type="button">ออกจากระบบ</button>
      </div>
      <nav id="navigation" aria-label="เมนูหลัก"></nav>
      <section id="view" aria-live="polite"></section>
    </section>
  </main>
</body>
</html>
