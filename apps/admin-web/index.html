<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="จัดการร้านสตรีมมิง">จัดการร้านสตรีมมิง</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <strong id="user-level">บัญชีผู้ใช้</strong><span data-i18n="ข้อมูลจำลอง / โหมดทดสอบ">ข้อมูลจำลอง / โหมดทดสอบ</span>
    <button id="language-switch" type="button" aria-label="เปลี่ยนภาษา">English</button>
    <button id="request-bell" type="button" aria-label="คำขอเปิดร้านที่รออนุมัติ" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 6-2 7-2 9h16c0-2-2-3-2-9m-8 12a2 2 0 0 0 4 0"></path>
      </svg>
      <b id="request-count" hidden></b>
    </button>
    <button id="owner-settings" type="button" aria-label="ตั้งค่า Owner" title="ตั้งค่า Owner" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle><path d="M4 22v-2a8 8 0 0 1 16 0v2"></path>
      </svg>
    </button>
  </header>
  <main>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="login" aria-labelledby="login-title">
      <h1 id="login-title" data-i18n="เข้าสู่ระบบ">เข้าสู่ระบบ</h1>
      <form id="credentials">
        <label><span data-i18n="ชื่อผู้ใช้">ชื่อผู้ใช้</span> <input name="username" autocomplete="username" required></label>
        <label><span data-i18n="รหัสผ่าน">รหัสผ่าน</span> <input name="password" type="password" autocomplete="current-password" required></label>
        <button data-i18n="เข้าสู่ระบบ">เข้าสู่ระบบ</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <div class="toolbar">
        <label id="store-control"><span data-i18n="ร้าน">ร้าน</span> <select id="store"></select></label>
        <button id="logout" type="button" data-i18n="ออกจากระบบ">ออกจากระบบ</button>
      </div>
      <nav id="navigation" aria-label="เมนูหลัก" data-i18n-label="เมนูหลัก"></nav>
      <section id="view" aria-live="polite"></section>
    </section>
  </main>
</body>
</html>
